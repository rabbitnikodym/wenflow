[project]
name = "wenflow"
version = "0.1.0"
description = "Personal Taiwanese Mandarin learning app"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "openai>=1.60",
  "jieba>=0.42.1",
  "pypinyin>=0.53",
  "opencc-python-reimplemented>=0.1.7",
  "yt-dlp>=2025.1.1",
  "faster-whisper>=1.1",
  "praat-parselmouth>=0.4.5",
  "numpy>=1.26",
  "edge-tts>=7.0",
  "trafilatura>=2.0",
  "feedparser>=6.0",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "nvidia-cublas-cu12>=12.9.3.13",
  "nvidia-cudnn-cu12>=9,<10",
  "g2pw>=0.1.1",
  "torch>=2.4",
]

[tool.uv]
package = false

# g2pW only needs torch for batching; the CPU build keeps the install small.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
